name: bms_tracker
description: "Alerts you when BookMyShow ticket booking opens at your chosen Trichy theaters."
publish_to: 'none'
version: 0.1.4+5

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_background_service: ^5.1.0
  flutter_inappwebview: ^6.1.5
  flutter_local_notifications: ^23.0.2
  http: ^1.6.0
  material_ui: ^1.1.0
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# Patched copy (Android Gradle Plugin 9 rejects 'proguard-android.txt').
dependency_overrides:
  flutter_inappwebview_android:
    path: third_party/flutter_inappwebview_android
