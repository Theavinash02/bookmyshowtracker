name: Build APK

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk bms-tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bms-tracker-apk
          path: bms-tracker.apk

      - name: Read app version
        if: github.ref == 'refs/heads/main'
        id: ver
        run: |
          v=$(grep '^version:' pubspec.yaml | sed -e 's/^version:[[:space:]]*//' -e 's/+.*//')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # One new release per build of main, tagged at the exact commit, so
      # .../releases/latest always points at the newest APK.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-build${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: BMS Tracker v${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          prerelease: false
          make_latest: true
          files: bms-tracker.apk
          body: |
            Download **bms-tracker.apk** on your Android phone and install it
            (allow "Install unknown apps" for your browser when asked).

            Always-newest direct link:
            https://github.com/${{ github.repository }}/releases/latest/download/bms-tracker.apk

            Built from ${{ github.sha }}.
