name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk bms-tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bms-tracker-apk
          path: bms-tracker.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BMS Tracker (latest build)
          prerelease: true
          make_latest: true
          files: bms-tracker.apk
          body: |
            Download **bms-tracker.apk** on your Android phone and install it
            (allow "Install unknown apps" for your browser when asked).
            Built from ${{ github.sha }}.
