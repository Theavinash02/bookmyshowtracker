name: Build APK

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Sign with the permanent key so updates install over the old app.
      # Branch builds without the secrets (e.g. forks) use the debug key;
      # a release from main must never be signed with it.
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "::error::Signing secrets are missing; see CONTRIBUTING.md." && exit 1
            fi
            echo "::warning::No signing secrets: building with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          {
            echo "BMS_KEYSTORE_PATH=$RUNNER_TEMP/release.p12"
            echo "BMS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BMS_KEY_ALIAS=$KEY_ALIAS"
            echo "BMS_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk bms-tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bms-tracker-apk
          path: bms-tracker.apk

      # A release is published only when pubspec.yaml has a version that
      # has no release yet. Other merges to main are built and tested only.
      - name: Check for a new version
        if: github.ref == 'refs/heads/main'
        id: ver
        run: |
          v=$(grep '^version:' pubspec.yaml | sed -e 's/^version:[[:space:]]*//' -e 's/+.*//')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$v is already released. Raise 'version:' in pubspec.yaml to publish a new release."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: github.ref == 'refs/heads/main' && steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: BMS Tracker v${{ steps.ver.outputs.version }}
          prerelease: false
          make_latest: true
          files: bms-tracker.apk
          generate_release_notes: true
          body: |
            Download **bms-tracker.apk** on your Android phone and install it
            (allow "Install unknown apps" for your browser when asked).
            It installs over the previous version and keeps your settings.

            Always-newest direct link:
            https://github.com/${{ github.repository }}/releases/latest/download/bms-tracker.apk
